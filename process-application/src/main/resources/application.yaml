# The process application connects to a local Camunda 8 Run by default (see README).
# Use the "saas" profile to connect to Camunda 8 SaaS: SPRING_PROFILES_ACTIVE=saas
spring:
  application:
    name: invoice-process-application

# No client addresses on purpose: the defaults of the self-managed mode (REST http://localhost:8080, gRPC
# http://localhost:26500) are the local C8 Run. Explicit addresses here would also apply to the "saas" profile.
camunda:
  client:
    mode: self-managed

logging:
  level:
    root: info
    io.camunda.demo: info

# The process application only serves the actuator health endpoint (http://localhost:8090/actuator/health/readiness).
# Port 8080 is the REST API of C8 Run.
server:
  port: 8090
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
