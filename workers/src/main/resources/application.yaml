# The job workers connect to a local Camunda 8 Run by default (see README).
# Use the "saas" profile to connect to Camunda 8 SaaS: SPRING_PROFILES_ACTIVE=saas
spring:
  application:
    name: invoice-workers
  main:
    web-application-type: none

# No client addresses on purpose: the defaults of the self-managed mode (REST http://localhost:8080, gRPC
# http://localhost:26500) are the local C8 Run. Explicit addresses here would also apply to the "saas" profile.
camunda:
  client:
    mode: self-managed

logging:
  level:
    root: info
    io.camunda.demo: info
