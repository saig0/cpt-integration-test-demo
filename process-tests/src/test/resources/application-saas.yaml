# Run the tests against Camunda 8 SaaS: mvn test -Psaas (credentials from environment variables,
# see .env.example). Create an API client with the scope "Orchestration Cluster API"
# in the Camunda SaaS console.
camunda:
  process-test:
    runtime-mode: remote
    # CPT 8.9 always tries to delete the data and to reset the clock after each test through the
    # management API (port 9600). SaaS doesn't expose it, so CPT logs "Failed to delete the runtime
    # data, skipping" after each test. There is no switch to turn that off (data-deletion-mode and
    # clock-reset-enabled need CPT 8.10+). Point the address to a closed port so that CPT can't hit
    # an unrelated cluster that listens on localhost:9600. The tests are isolated by using unique
    # invoice IDs and selectors that are scoped to the started process instance.
    remote:
      camunda-monitoring-api-address: http://127.0.0.1:9
    assertion:
      # The data is exported asynchronously. Give the assertions more time than the default (10s).
      timeout: PT30S
  client:
    mode: saas
    auth:
      client-id: ${CAMUNDA_CLIENT_ID}
      client-secret: ${CAMUNDA_CLIENT_SECRET}
    cloud:
      cluster-id: ${CAMUNDA_CLUSTER_ID}
      region: ${CAMUNDA_CLUSTER_REGION}
      # Production SaaS: camunda.io. Another stage, e.g. INT: ultrawombat.com (the token URL, audience and addresses follow).
      domain: ${CAMUNDA_CLUSTER_DOMAIN:camunda.io}

demo:
  # SaaS doesn't allow to manipulate the clock.
  clock-manipulation:
    enabled: false
