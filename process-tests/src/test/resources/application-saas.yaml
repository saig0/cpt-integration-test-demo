# Run the tests against Camunda 8 SaaS: mvn test -Psaas (credentials from environment variables,
# see .env.example). Create an API client with the scopes "Zeebe", "Tasklist" and "Operate" (8.9: "Zeebe")
# in the Camunda SaaS console.
camunda:
  process-test:
    runtime-mode: remote
    # SaaS doesn't expose the management API (port 9600) that CPT uses to purge the cluster.
    # Don't delete the data between the tests (requires CPT 8.10+). The tests are isolated by using
    # unique invoice IDs instead.
    data-deletion-mode: none
    # Don't reset the clock after each test: the timer tests are skipped below. To try the public clock API on
    # SaaS (CPT 8.11), set this to true and demo.clock-manipulation.enabled to true. Not verified.
    clock-reset-enabled: false
    assertion:
      # The data is exported asynchronously. Give the assertions more time than the default (10s).
      timeout: PT30S
  client:
    mode: saas
    auth:
      client-id: ${CAMUNDA_CLIENT_ID}
      client-secret: ${CAMUNDA_CLIENT_SECRET}
    cloud:
      cluster-id: ${CAMUNDA_CLUSTER_ID}
      region: ${CAMUNDA_CLUSTER_REGION}

demo:
  # SaaS (<= 8.10) doesn't allow to manipulate the clock. With CPT 8.11 the public clock API is used: not verified on SaaS.
  clock-manipulation:
    enabled: false
