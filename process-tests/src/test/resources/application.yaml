# Default: run the tests against a local Camunda 8 Run (started with `c8ctl cluster start`).
# Use the "saas" profile (mvn test -Psaas) to run the tests against Camunda 8 SaaS.
camunda:
  process-test:
    # Don't start a runtime with Testcontainers. Connect to the running cluster instead.
    runtime-mode: remote
    # Don't purge the cluster after each test (CPT's default, CLUSTER_PURGE). The purge deletes everything on the
    # cluster, including the BPMN/DMN resources that the process application deployed. The tests don't deploy
    # resources, so the deployments must survive. The tests are isolated by unique invoice IDs and by selectors
    # that are scoped to the started process instance. Requires CPT 8.10+.
    data-deletion-mode: none
    remote:
      # The management API of the cluster. Only used by CPT <= 8.10 / the 8.11.0-alpha1 jar to manipulate the clock.
      camunda-monitoring-api-address: http://127.0.0.1:9600
      # Only needed to test with Connectors (the tests of this demo don't use them)
      connectors-rest-api-address: http://127.0.0.1:8086
      runtime-connection-timeout: PT1M
  client:
    # No client addresses on purpose: the defaults of the self-managed mode (REST http://localhost:8080, gRPC
    # http://localhost:26500) are the local C8 Run. Explicit addresses here would also apply to the "saas" profile.
    mode: self-managed
    # Job workers run in a separate application
    worker:
      defaults:
        enabled: false

demo:
  clock-manipulation:
    # Off by default on 8.10: increaseTime together with data-deletion-mode=none leaves the cluster unhealthy for
    # the next test (camunda/camunda#62541, not fixed in 8.10). A purge would fix that, but it also deletes the resources
    # that the process application deployed. Set to true only to experiment (then restart/purge the cluster).
    enabled: false

logging:
  level:
    root: info
    io.camunda.process.test: info
    org.testcontainers: warn
