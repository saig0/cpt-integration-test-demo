# Default: run the tests against a local Camunda 8 Run (started with `c8ctl cluster start`).
# Use the "saas" profile (mvn test -Psaas) to run the tests against Camunda 8 SaaS.
camunda:
  process-test:
    # Don't start a runtime with Testcontainers. Connect to the running cluster instead.
    runtime-mode: remote
    # CPT 8.9 has no data-deletion-mode: it always purges the cluster after each test (through the management API),
    # which would also delete the resources that the process application deployed (the tests don't deploy resources).
    # Workaround: point the management API address to a closed port. CPT then logs "Failed to delete the runtime data,
    # skipping" and "Failed to reset the time, skipping" after each test and keeps the data. Consequences: no clock
    # manipulation (the clock uses the same address) and no JSON tests (no start-time isolation, see below).
    remote:
      # See above: a closed port on purpose. (Default: http://127.0.0.1:9600, the management API of C8 Run.)
      camunda-monitoring-api-address: http://127.0.0.1:9
      # Only needed to test with Connectors (the tests of this demo don't use them)
      connectors-rest-api-address: http://127.0.0.1:8086
      runtime-connection-timeout: PT1M
  client:
    # No client addresses on purpose: the defaults of the self-managed mode (REST http://localhost:8080, gRPC
    # http://localhost:26500) are the local C8 Run. Explicit addresses here would also apply to the "saas" profile.
    mode: self-managed
    # Job workers run in a separate application
    worker:
      defaults:
        enabled: false

demo:
  clock-manipulation:
    # CPT 8.9 needs the management API for the clock (closed above), so no timer tests.
    enabled: false
  json-tests:
    # The JSON test cases select by process definition ID. CPT 8.9 has no start-time isolation, so on a cluster that is
    # not purged they see the data of earlier runs. The Java tests are scoped to their process instance.
    enabled: false

logging:
  level:
    root: info
    io.camunda.process.test: info
    org.testcontainers: warn
